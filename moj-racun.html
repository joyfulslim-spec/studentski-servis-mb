<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moj račun – Študentski servis Maribor</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="account">
<main id="main">
  <section class="page-hero">
    <div class="container row between">
      <div class="stack-sm">
        <span class="eyebrow" style="color:var(--yellow)">Moj račun</span>
        <h1 id="accName">Moj račun</h1>
        <p class="lead" id="accMeta" style="margin-top:0"></p>
      </div>
      <button class="btn btn-outline btn-sm" id="logout" type="button">Odjava</button>
    </div>
  </section>

  <section class="section" style="padding-top:24px">
    <div class="container dash">
      <nav class="dash-nav" aria-label="Moj račun">
        <a href="#pregled">Pregled</a><a href="#zasluzek">Zaslužek</a><a href="#napotnice">Napotnice</a><a href="#prijave">Prijave na dela</a><a href="#hitro">Hitra dejanja</a>
      </nav>
      <div class="stack">
        <div id="accAlert"></div>
        <div id="pregled"><div class="kpis" id="kpis"></div></div>

        <div class="card stack" id="zasluzek">
          <div class="row between"><h2 style="font-size:1.3rem">Neto zaslužek po mesecih</h2><span class="small muted">v evrih</span></div>
          <div class="bars" id="bars"></div>
        </div>

        <div class="card stack" id="napotnice">
          <div class="row between"><h2 style="font-size:1.3rem">Moje napotnice</h2><a class="btn btn-primary btn-sm" href="napotnica.html">Nova napotnica</a></div>
          <div class="table-wrap"><table class="tbl"><thead><tr><th>Številka</th><th>Delodajalec</th><th>Datum</th><th>Stanje</th></tr></thead><tbody id="napTable"></tbody></table></div>
        </div>

        <div class="stack" id="prijave">
          <h2 style="font-size:1.3rem">Moje prijave na dela</h2>
          <div class="job-list cols" id="appList"></div>
        </div>

        <div class="card stack" id="hitro">
          <h2 style="font-size:1.3rem">Hitra dejanja</h2>
          <div class="row"><a class="btn btn-outline" href="podaljsaj-status.html">Podaljšaj status</a><a class="btn btn-outline" href="kalkulator.html">Kalkulator</a><a class="btn btn-outline" href="dohodnina-obrazci.html">Dohodnina</a></div>
        </div>
      </div>
    </div>
  </section>
</main>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
