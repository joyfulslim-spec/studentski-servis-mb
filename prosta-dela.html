<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prosta dela – Študentski servis Maribor</title>
  <meta name="description" content="Prosta študentska in dijaška dela po regijah, vrsti dela in urni postavki.">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Source+Sans+3:wght@400;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Source+Sans+3:wght@400;700&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="jobs">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<main id="main">
  <section class="page-hero">
    <div class="container">
      <ol class="crumbs"><li><a href="index.html">Domov</a></li><li>Za študente</li><li>Prosta dela</li></ol>
      <h1>Prosta dela</h1>
      <p class="lead">Plačilo, kraj in delovni čas vidiš že na seznamu. Rezultati se posodobijo takoj, ko spremeniš filter.</p>
    </div>
  </section>

  <section class="section" style="padding-top:24px">
    <div class="container stack">
      <form id="searchForm" class="stack" role="search">
        <div class="field">
          <label for="fQ" class="sr-only">Iskanje</label>
          <input type="search" id="fQ" placeholder="Išči po nazivu dela, podjetju, kraju ali šifri">
        </div>
        <div class="chip-row" id="chips" aria-label="Priljubljene vrste dela"></div>
      </form>

      <div class="jobs-layout">
        <div>
          <button class="btn btn-outline btn-block filter-toggle" id="filterToggle" type="button" aria-expanded="false" aria-controls="filtersPanel">Filtri <span id="filterCount"></span></button>
          <aside class="card filters-panel" id="filtersPanel" hidden aria-label="Filtri">
            <div class="field"><label for="fRegija">Regija</label><select id="fRegija"></select></div>
            <div class="field"><label for="fKat">Vrsta dela</label><select id="fKat"></select></div>
            <div class="field">
              <span class="label" id="payLbl">Plačilo na uro (bruto)</span>
              <div class="range" role="group" aria-labelledby="payLbl">
                <div class="range-track"><span class="range-fill" id="payFill"></span></div>
                <input type="range" id="fMin" min="7" max="14" step="0.5" value="7" aria-label="Najmanj na uro">
                <input type="range" id="fMax" min="7" max="14" step="0.5" value="14" aria-label="Največ na uro">
              </div>
              <div class="range-vals"><span id="fMinVal">7,00 €</span><span id="fMaxVal">14,00 €</span></div>
            </div>
            <fieldset class="fgroup"><legend class="label">Trajanje</legend>
              <label class="check"><input type="checkbox" name="traj" value="enkratno"> Enkratno ali nekaj dni</label>
              <label class="check"><input type="checkbox" name="traj" value="kratko"> Do 6 mesecev</label>
              <label class="check"><input type="checkbox" name="traj" value="dolgo"> Dolgoročno</label>
            </fieldset>
            <fieldset class="fgroup"><legend class="label">Delovni čas</legend>
              <label class="check"><input type="checkbox" name="cas" value="vikend"> Vikendi</label>
              <label class="check"><input type="checkbox" name="cas" value="popoldne"> Popoldne</label>
              <label class="check"><input type="checkbox" name="cas" value="fleks"> Fleksibilno / po dogovoru</label>
              <label class="check"><input type="checkbox" name="cas" value="doma"> Delo od doma</label>
            </fieldset>
            <label class="check"><input type="checkbox" id="fDijaki"> Samo dela, primerna za dijake</label>
            <button class="link-btn" id="clearFilters" type="button" style="justify-self:start">Počisti filtre</button>
          </aside>
        </div>

        <div class="stack">
          <div class="results-head">
            <p aria-live="polite">Najdenih del: <b id="count">0</b></p>
            <div class="row" style="gap:8px"><label for="fSort" class="small muted">Razvrsti</label>
              <select id="fSort" style="width:auto;min-height:42px"><option value="novo">Najnovejša</option><option value="urna">Najvišje plačilo</option><option value="urna-asc">Najnižje plačilo</option></select></div>
          </div>
          <div class="job-list" id="jobList"></div>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
