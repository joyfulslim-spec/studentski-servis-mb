<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oddaja oglasa za delo – Študentski servis Maribor</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="jobPost">
<main id="main">
  <section class="page-hero">
    <div class="container">
      <ol class="crumbs"><li><a href="index.html">Domov</a></li><li><a href="podjetja.html">Za podjetja</a></li><li>Oddaja oglasa</li></ol>
      <h1>Oddaja oglasa za delo</h1>
      <p class="lead">Ob desni sproti vidite, kako bo oglas videti študentom.</p>
    </div>
  </section>

  <section class="section" style="padding-top:24px">
    <div class="container detail-layout" id="postWrap">
      <form class="card stack" id="postForm" novalidate>
        <h2 style="font-size:1.3rem">O delu</h2>
        <div class="form-grid two">
          <div class="field span-2"><label for="ogNaziv">Naziv dela <span class="req">*</span></label><input type="text" id="ogNaziv" required placeholder="npr. Pomoč v strežbi"></div>
          <div class="field"><label for="ogKat">Vrsta dela <span class="req">*</span></label><select id="ogKat" required></select></div>
          <div class="field"><label for="ogRegija">Regija</label><select id="ogRegija"></select></div>
          <div class="field"><label for="ogKraj">Kraj dela <span class="req">*</span></label><input type="text" id="ogKraj" required placeholder="npr. Maribor – Lent"></div>
          <div class="field"><label for="ogUrna">Bruto urna postavka (€) <span class="req">*</span></label><input type="number" id="ogUrna" min="0" step="0.1" inputmode="decimal" required><span class="hint">Najmanj zakonska minimalna urna postavka.</span></div>
          <div class="field span-2"><label for="ogCas">Delovni čas <span class="req">*</span></label><input type="text" id="ogCas" required placeholder="npr. Vikendi, 8.00–16.00"></div>
          <div class="field span-2"><label for="ogOpis">Opis dela <span class="req">*</span></label><textarea id="ogOpis" required placeholder="Kaj bo študent delal in kaj pričakujete?"></textarea></div>
          <label class="check span-2"><input type="checkbox" id="ogDijaki"> Delo je primerno tudi za dijake (mladoletne)</label>
        </div>
        <h2 style="font-size:1.3rem">Kontakt</h2>
        <div class="form-grid two">
          <div class="field"><label for="ogPodjetje">Podjetje <span class="req">*</span></label><input type="text" id="ogPodjetje" autocomplete="organization" required></div>
          <div class="field"><label for="ogDavcna">Davčna številka <span class="req">*</span></label><input type="text" id="ogDavcna" required inputmode="numeric" data-pattern="^(SI)?[0-9]{8}$" data-msg="Davčna številka ima 8 števk (npr. SI12345678)."></div>
          <div class="field"><label for="ogOseba">Kontaktna oseba <span class="req">*</span></label><input type="text" id="ogOseba" autocomplete="name" required></div>
          <div class="field"><label for="ogEmail">E-pošta <span class="req">*</span></label><input type="email" id="ogEmail" autocomplete="email" required></div>
        </div>
        <label class="check"><input type="checkbox" required> Strinjam se s splošnimi pogoji poslovanja in obdelavo podatkov (GDPR – podjetja).</label>
        <button class="btn btn-red btn-block" type="submit">Oddaj oglas</button>
      </form>
      <aside class="detail-aside stack">
        <span class="eyebrow">Predogled oglasa</span>
        <div id="ogPreview"></div>
        <div class="notice small">Oglas pregledamo in objavimo v 1 delovnem dnevu. Strošek dela izračunate v <a href="izracun-stroska.html">izračunu stroška</a>.</div>
      </aside>
    </div>
  </section>
</main>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
